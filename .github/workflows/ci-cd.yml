name: KisanIQ CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/shiven-rajput-007/kisaniq-backend
  FRONTEND_IMAGE: ghcr.io/shiven-rajput-007/kisaniq-frontend

jobs:
  # ============================================================================
  # STAGE 1 & 2: SOURCE CODE CHECKOUT, BUILD & AUTOMATED TESTS
  # ============================================================================
  build-and-test:
    name: "Stage 1 & 2: Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Compile Backend TypeScript
        working-directory: server
        run: npm run build

      - name: Run Backend Automated Test Suite
        working-directory: server
        run: npm run test:mandi

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend i18n Key Parity Tests
        working-directory: frontend
        run: npm run test:i18n

      - name: Build Frontend Production SPA Bundle
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # STAGE 3: DOCKER BUILD, CONFIG VALIDATION & GHCR PUBLISH
  # ============================================================================
  docker-build-publish:
    name: "Stage 3: Docker Build & Publish"
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating compose.yaml syntax..."
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
            VITE_API_BASE_URL=/api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 4: CONDITIONAL REMOTE SERVER DEPLOYMENT VIA SSH
  # ============================================================================
  deploy:
    name: "Stage 4: Remote Linux Deployment (SSH)"
    needs: docker-build-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Remote Deployment Credentials
        id: check-secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Remote deployment credentials (DEPLOY_HOST, DEPLOY_SSH_KEY) are not set."
            echo "Skipping remote SSH deployment step cleanly."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Remote deployment credentials verified."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Remote SSH Deployment
        if: steps.check-secrets.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          TARGET_DIR="${DEPLOY_PATH:-~/kisaniq-production}"
          echo "Connecting to $DEPLOY_USER@$DEPLOY_HOST..."

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            mkdir -p '$TARGET_DIR'
            cd '$TARGET_DIR'

            if [ -n '$GHCR_TOKEN' ] && [ -n '$GHCR_USERNAME' ]; then
              echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
            fi

            echo 'Pulling latest KisanIQ containers...'
            docker compose pull || true

            echo 'Restarting multi-container stack...'
            docker compose up -d --remove-orphans

            echo 'Verifying running containers...'
            docker compose ps
          "
          echo "Deployment finished successfully!"
