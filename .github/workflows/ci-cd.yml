name: KisanIQ CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions required to publish packages to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/kisaniq-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/kisaniq-frontend

jobs:
  # ============================================================================
  # STAGE 1 & 2: SOURCE CODE CHECKOUT, DEPENDENCY INSTALLATION, BUILD & TESTS
  # ============================================================================
  build-and-test:
    name: "Stage 1 & 2: Build & Test (Source, TypeScript, React)"
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Compile Backend TypeScript
        working-directory: server
        run: npm run build

      - name: Run Backend Automated Test Suite (Mandi Decision & Routing)
        working-directory: server
        run: npm run test:mandi

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend i18n Key Parity Test Suite (EN, HI, MR)
        working-directory: frontend
        run: npm run test:i18n

      - name: Build Frontend Production SPA Bundle
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # STAGE 3: DOCKER BUILD, CONFIG VALIDATION & GHCR IMAGE PUBLISHING
  # ============================================================================
  docker-build-publish:
    name: "Stage 3: Docker Build, Validation & GHCR Publish"
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating compose.yaml syntax and configuration..."
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Backend
      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      # Build and push Backend Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata (tags, labels) for Frontend
      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      # Build and push Frontend Image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
            VITE_API_BASE_URL=/api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 4: CONDITIONAL REMOTE SERVER DEPLOYMENT VIA SSH
  # ============================================================================
  deploy:
    name: "Stage 4: Remote Linux Server Deployment (SSH)"
    needs: docker-build-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: Validate Remote Deployment Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::notice ::Remote deployment secrets (DEPLOY_HOST, DEPLOY_SSH_KEY) are not configured. Skipping remote SSH execution."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "Remote deployment secrets verified. Proceeding with SSH deployment."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Remote SSH Deployment
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="~/kisaniq-production"
            fi

            echo "🚀 Starting remote deployment in $DEPLOY_DIR..."
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Optional GHCR Authentication for private images
            if [ -n "${{ secrets.GHCR_TOKEN }}" ] && [ -n "${{ secrets.GHCR_USERNAME }}" ]; then
              echo "Authenticating with GitHub Container Registry..."
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            # Pull latest compose configuration if git exists or copy files
            echo "Pulling latest Docker images..."
            docker compose pull || true

            echo "Recreating and restarting multi-container stack..."
            docker compose up -d --remove-orphans

            echo "Verifying running container status..."
            docker compose ps

            echo "Checking container health..."
            sleep 10
            docker compose ps
            echo "✅ Deployment completed successfully!"
